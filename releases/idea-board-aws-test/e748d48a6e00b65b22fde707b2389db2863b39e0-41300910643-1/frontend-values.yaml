fullnameOverride: idea-board-frontend
containerName: frontend
image:
  repository: 812752207041.dkr.ecr.us-west-2.amazonaws.com/idea-board-test/frontend
  tag: git-e748d48a6e00b65b22fde707b2389db2863b39e0-41300910643-1@sha256:a229bf0ed35b61b85d50f1828e044dadc008ef158f0509c8b9d7d958c924b4f2
  pullPolicy: IfNotPresent
workload:
  enabled: true
  kind: Deployment
  replicaCount: 1
  deployment:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
service:
  enabled: true
  type: LoadBalancer
  port: 80
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    idea-board/public-host: ''
containerPorts:
- name: http
  containerPort: 8080
  protocol: TCP
env:
  BACKEND_HOST: idea-board-backend
  NGINX_ENVSUBST_FILTER: BACKEND_HOST|TLS_LISTEN|RELEASE_ID
  TLS_LISTEN: ''
  RELEASE_ID: e748d48a6e00b65b22fde707b2389db2863b39e0-41300910643-1
automountServiceAccountToken: false
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  failureThreshold: 30
podDisruptionBudget:
  enabled: true
  minAvailable: 1
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
terminationGracePeriodSeconds: 30
volumes:
- name: nginx-config
  emptyDir:
    sizeLimit: 8Mi
- name: nginx-cache
  emptyDir:
    sizeLimit: 64Mi
- name: nginx-tmp
  emptyDir:
    sizeLimit: 16Mi
volumeMounts:
- name: nginx-config
  mountPath: /etc/nginx/conf.d
- name: nginx-cache
  mountPath: /var/cache/nginx
- name: nginx-tmp
  mountPath: /tmp
podAnnotations:
  idea-board/release-image: 812752207041.dkr.ecr.us-west-2.amazonaws.com/idea-board-test/frontend:git-e748d48a6e00b65b22fde707b2389db2863b39e0-41300910643-1@sha256:a229bf0ed35b61b85d50f1828e044dadc008ef158f0509c8b9d7d958c924b4f2
  idea-board/gitops-release: e748d48a6e00b65b22fde707b2389db2863b39e0-41300910643-1
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/instance: idea-board-frontend
commonAnnotations:
  argocd.argoproj.io/sync-wave: '10'
