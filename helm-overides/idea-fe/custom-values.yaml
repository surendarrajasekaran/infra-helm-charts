fullnameOverride: idea-board-frontend
containerName: frontend
image:
  repository: 812752207041.dkr.ecr.us-west-2.amazonaws.com/idea-board-test/frontend
  tag: git-ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1@sha256:89ddf43451b5700e6799440285715162ecc6403cba37e2fa51401a32a671c973
  pullPolicy: IfNotPresent
workload:
  enabled: true
  kind: Deployment
  replicaCount: 2
  deployment:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
service:
  enabled: true
  type: LoadBalancer
  port: 80
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    idea-board/public-host: ''
containerPorts:
- name: http
  containerPort: 8080
  protocol: TCP
env:
  BACKEND_HOST: idea-board-backend
  NGINX_ENVSUBST_FILTER: BACKEND_HOST|TLS_LISTEN|RELEASE_ID
  TLS_LISTEN: ''
  RELEASE_ID: ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1
automountServiceAccountToken: false
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  failureThreshold: 30
podDisruptionBudget:
  enabled: true
  minAvailable: 1
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
terminationGracePeriodSeconds: 30
volumes:
- name: nginx-config
  emptyDir:
    sizeLimit: 8Mi
- name: nginx-cache
  emptyDir:
    sizeLimit: 64Mi
- name: nginx-tmp
  emptyDir:
    sizeLimit: 16Mi
volumeMounts:
- name: nginx-config
  mountPath: /etc/nginx/conf.d
- name: nginx-cache
  mountPath: /var/cache/nginx
- name: nginx-tmp
  mountPath: /tmp
podAnnotations:
  idea-board/release-image: 812752207041.dkr.ecr.us-west-2.amazonaws.com/idea-board-test/frontend:git-ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1@sha256:89ddf43451b5700e6799440285715162ecc6403cba37e2fa51401a32a671c973
  idea-board/gitops-release: ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  labelSelector:
    matchLabels:
      app.kubernetes.io/instance: idea-board-frontend
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/instance: idea-board-frontend
commonAnnotations:
  argocd.argoproj.io/sync-wave: '10'
autoscaling:
  enabled: true
  type: hpa
  minReplicas: 2
  maxReplicas: 4
  hpa:
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: idea-board-frontend
        topologyKey: kubernetes.io/hostname
    - weight: 50
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: idea-board-frontend
        topologyKey: topology.kubernetes.io/zone
