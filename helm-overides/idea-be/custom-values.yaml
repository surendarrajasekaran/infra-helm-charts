fullnameOverride: idea-board-backend
containerName: backend
image:
  repository: 812752207041.dkr.ecr.us-west-2.amazonaws.com/idea-board-test/backend
  tag: git-ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1@sha256:dd7d60c746b7fedf8aaa66ad13e47688f45e7a0777bcf38a8fe26875a2790029
  pullPolicy: IfNotPresent
workload:
  enabled: true
  kind: Deployment
  replicaCount: 2
  deployment:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
service:
  enabled: true
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
containerPorts:
- name: http
  containerPort: 8000
  protocol: TCP
envFrom:
- secretRef:
    name: idea-board-database
automountServiceAccountToken: false
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
initContainers:
- name: migrate
  image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
  imagePullPolicy: IfNotPresent
  command:
  - python
  - -m
  - app.migrate
  envFrom:
  - secretRef:
      name: idea-board-migration
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  volumeMounts:
  - name: database-ca
    mountPath: /etc/postgresql/ca
    readOnly: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  failureThreshold: 30
podDisruptionBudget:
  enabled: true
  minAvailable: 1
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
terminationGracePeriodSeconds: 30
volumes:
- name: database-ca
  secret:
    secretName: idea-board-database-ca
    defaultMode: 292
volumeMounts:
- name: database-ca
  mountPath: /etc/postgresql/ca
  readOnly: true
podAnnotations:
  idea-board/release-image: 812752207041.dkr.ecr.us-west-2.amazonaws.com/idea-board-test/backend:git-ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1@sha256:dd7d60c746b7fedf8aaa66ad13e47688f45e7a0777bcf38a8fe26875a2790029
  idea-board/database-version: ''
  idea-board/gitops-release: ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  labelSelector:
    matchLabels:
      app.kubernetes.io/instance: idea-board-backend
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/instance: idea-board-backend
commonAnnotations:
  argocd.argoproj.io/sync-wave: '0'
env:
  RELEASE_ID: ec9eff1ebeb328e60e84a855810bcb366731034b-41311171474-1
autoscaling:
  enabled: true
  type: hpa
  minReplicas: 2
  maxReplicas: 4
  hpa:
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: idea-board-backend
        topologyKey: kubernetes.io/hostname
    - weight: 50
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: idea-board-backend
        topologyKey: topology.kubernetes.io/zone
