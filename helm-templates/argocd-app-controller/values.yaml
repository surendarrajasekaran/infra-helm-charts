controllerNamespace: ""
namePrefix: ""
project: ""
clusterName: ""
environment: ""
server: https://kubernetes.default.svc
global:
  repoURL: ""
  chartPath: ""
  targetRevision: main
# Application deletion leaves workloads running by default.
cascadeDeletion: false
syncPolicy:
  automated:
    enabled: true
    prune: true
    selfHeal: true
    allowEmpty: false
  retry:
    limit: 5
    refresh: true
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m
  syncOptions:
    - PruneLast=true
    - ApplyOutOfSyncOnly=true
    - FailOnSharedResource=true
    - ServerSideApply=true
# Each enabled entry needs a namespace and a sourcePath (or global.chartPath).
# Helm sources accept helmValuesFiles, helmParameters and additionalSources.
applications: {}
