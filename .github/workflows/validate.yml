name: Validate Helm configuration
on:
  push:
    branches: [main]
    paths: [helm-common/**, helm-overides/**, helm-templates/**, argocd-manifests/**, bootstrap/**, .github/workflows/validate.yml]
  pull_request:
    paths: [helm-common/**, helm-overides/**, helm-templates/**, argocd-manifests/**, bootstrap/**, .github/workflows/validate.yml]
permissions:
  contents: read
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.19.0 }
      - run: pip install PyYAML==6.0.3
      - run: helm lint helm-templates/nucleus -f helm-overides/idea-fe/custom-values.yaml
      - run: helm lint helm-templates/nucleus -f helm-overides/idea-be/custom-values.yaml
      - run: helm lint helm-templates/argocd-app-controller -f helm-overides/argocd-app-controller/custom-values.yaml
      - name: Validate the parent and two service Applications
        run: |
          helm template idea-board-test-apps helm-templates/argocd-app-controller --namespace argocd -f helm-overides/argocd-app-controller/custom-values.yaml > /tmp/idea-board-applications.yaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          docs = list(yaml.safe_load_all(Path('/tmp/idea-board-applications.yaml').read_text()))
          assert {doc['metadata']['name'] for doc in docs} == {'idea-board-backend','idea-board-frontend'}
          assert all(doc['kind']=='Application' and doc['spec']['project']=='idea-board-test' for doc in docs)
          for doc in docs:
              assert doc['spec']['ignoreDifferences'] == [{'group':'apps','kind':'Deployment','name':doc['metadata']['name'],'namespace':'idea-board-test','jsonPointers':['/spec/replicas']}]
              assert 'RespectIgnoreDifferences=true' in doc['spec']['syncPolicy']['syncOptions']
          projects = list(yaml.safe_load_all(Path('argocd-manifests/projects.yaml').read_text()))
          workload = next(doc for doc in projects if doc['metadata']['name']=='idea-board-test')
          assert {'group':'autoscaling','kind':'HorizontalPodAutoscaler'} in workload['spec']['namespaceResourceWhitelist']
          parent = yaml.safe_load(Path('argocd-manifests/idea-board-controller.yaml').read_text())
          assert parent['spec']['source']['path'] == 'helm-templates/argocd-app-controller'
          assert parent['spec']['source']['helm']['valueFiles'] == ['../../helm-overides/argocd-app-controller/custom-values.yaml']
          print('Parent and two service Applications, scoped project and HPA replica ownership verified')
          PY
      - name: Verify chart provenance and rendered workload security
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          import yaml
          assert not Path('environments').exists(), 'Release records belong under releases'
          assert not Path('automation').exists(), 'Health scripts are loaded from pinned source'
          assert not Path('bootstrap').exists(), 'Parent/project manifests belong in argocd-manifests'
          assert not Path('helm-common').exists(), 'Obsolete chart directory must stay removed'
          assert not Path('bootstrap/idea-board-applications.yaml').exists(), 'Application values belong in helm-overides'
          root = Path('helm-templates/nucleus')
          for file, digest in json.loads(Path('helm-templates/nucleus-source.json').read_text())['sha256'].items():
              assert hashlib.sha256((root / file).read_bytes()).hexdigest() == digest, file
          for component, folder in [('frontend','idea-fe'), ('backend','idea-be')]:
              output = subprocess.check_output(['helm','template','idea-board-'+component,str(root),'--namespace','idea-board-test','--skip-tests','-f','helm-overides/'+folder+'/custom-values.yaml'], text=True)
              docs = [doc for doc in yaml.safe_load_all(output) if doc]
              assert not any(doc['kind']=='Secret' for doc in docs)
              deployment = next(doc for doc in docs if doc['kind']=='Deployment')
              assert 'replicas' not in deployment['spec'], 'HPA owns live scale'
              hpa = next(doc for doc in docs if doc['kind']=='HorizontalPodAutoscaler')
              assert hpa['apiVersion']=='autoscaling/v2'
              assert 2 <= hpa['spec']['minReplicas'] <= 3
              assert hpa['spec']['maxReplicas']==4
              assert hpa['spec']['scaleTargetRef']['name']==deployment['metadata']['name']
              assert hpa['spec']['metrics']==[{'type':'Resource','resource':{'name':'cpu','target':{'type':'Utilization','averageUtilization':70}}}]
              assert hpa['spec']['behavior']['scaleDown']['stabilizationWindowSeconds']==300
              assert next(doc for doc in docs if doc['kind']=='PodDisruptionBudget')['spec']['minAvailable']==1
              pod = deployment['spec']['template']['spec']
              labels = deployment['spec']['selector']['matchLabels']
              terms = pod['affinity']['podAntiAffinity']['preferredDuringSchedulingIgnoredDuringExecution']
              assert {term['podAffinityTerm']['topologyKey'] for term in terms} == {'kubernetes.io/hostname','topology.kubernetes.io/zone'}
              assert all(term['podAffinityTerm']['labelSelector']['matchLabels'].items() <= labels.items() for term in terms)
              assert all(rule['labelSelector']['matchLabels'].items() <= labels.items() for rule in pod['topologySpreadConstraints'])
              assert pod['automountServiceAccountToken'] is False
              for container in pod['containers'] + pod.get('initContainers', []):
                  security = container['securityContext']
                  assert security['runAsNonRoot'] is True
                  assert security['readOnlyRootFilesystem'] is True
                  assert security['allowPrivilegeEscalation'] is False
                  assert 'ALL' in security['capabilities']['drop']
                  assert '@sha256:' in container['image']
          print('Chart provenance, security, HPA bounds and pod placement verified')
          PY
