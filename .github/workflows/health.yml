name: GitOps health and guarded recovery
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["environments/**/release.json"]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - id: targets
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          targets = []
          for path in Path('environments').glob('*/release.json'):
              data = json.loads(path.read_text())
              if data.get('public_url') and re.fullmatch(r'[a-z0-9][a-z0-9-]{2,60}', path.parent.name):
                  targets.append({'target': path.parent.name, 'environment': data['cloud'] + '-' + data['environment']})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps({'include': targets}) + '\n')
              output.write('has_targets=' + str(bool(targets)).lower() + '\n')
          PY
  observe:
    needs: discover
    if: needs.discover.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ matrix.environment }}
    concurrency:
      group: health-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r automation/requirements.txt
      - name: Observe the exact frontend/backend release, assess health, recover Git if needed
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-flash-latest' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name 'idea-board-health[bot]'
          git config user.email 'idea-board-health@users.noreply.github.com'
          python automation/gitops_monitor.py --target "$TARGET" --output "artifacts/$TARGET/health.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-${{ matrix.target }}-${{ github.run_id }}
          path: artifacts/**/health.json
          if-no-files-found: ignore
