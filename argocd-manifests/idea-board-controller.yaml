apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idea-board-controller
  namespace: argocd
spec:
  project: idea-board-controller
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/surendarrajasekaran/infra-helm-charts.git
    targetRevision: main
    path: helm-templates/argocd-app-controller
    helm:
      releaseName: idea-board-test-apps
      valueFiles:
      - ../../helm-overides/argocd-app-controller/custom-values.yaml
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
    - ServerSideApply=true
