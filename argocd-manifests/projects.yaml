apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: idea-board-controller
  namespace: argocd
spec:
  description: 'Parent controller: manages only child Applications in argocd'
  sourceRepos:
  - https://github.com/surendarrajasekaran/infra-helm-charts.git
  destinations:
  - namespace: argocd
    server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: idea-board-test
  namespace: argocd
spec:
  description: Isolated test application; no cluster resources or Secrets from Git
  sourceRepos:
  - https://github.com/surendarrajasekaran/infra-helm-charts.git
  destinations:
  - namespace: idea-board-test
    server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: apps
    kind: Deployment
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: ResourceQuota
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: policy
    kind: PodDisruptionBudget
